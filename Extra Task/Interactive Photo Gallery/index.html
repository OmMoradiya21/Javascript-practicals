    <h1>Interactive Photo Gallery</h1>
    <div class="addPhotoDiv">
      <form id="form">
        <label for="photoURL">Add Photo: </label>
        <input
          type="url"
          required
          id="photoURL"
          placeholder="https://www.image/abc"
        />
        <button type="submit" class="addBtn" id="addBtn">Add</button>
      </form>
    </div>
    <div class="photoesContainer" id="photoesContainer">

      <div id="1" class="photo">
    <button type="button" onclick="deletePhoto('1')">Delete</button>
    <a href="https://images.pexels.com/photos/38251297/pexels-photo-38251297.jpeg">
    <img src="https://images.pexels.com/photos/38251297/pexels-photo-38251297.jpeg" alt="family">
    </a>
    </div>

    </div>
