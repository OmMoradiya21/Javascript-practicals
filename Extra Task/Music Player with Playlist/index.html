<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>
      Music Player with Playlist
    </title>
  </head>

  <body>
    <div class="container">
      <div class="player">
        <h1 class="title">Play For You</h1>

        <div class="playerContent">
          <div id="playerAlbum">
            <img
              src="https://imgs.search.brave.com/Nd64HBdwGWNedRrHKXN7ahBUiBlOOM-fj1b9K_LCYUU/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzdkLzZl/L2Q4LzdkNmVkOGM3/ZjQ5YzZhYmEyZjZl/MzVlMjZlNTRlNWE4/LmpwZw"
              alt="song cover"
            />
          </div>
          <div class="playerDisplay">
            <div>
              <p id="songTitle"></p>
              <p id="songArtist"></p>
            </div>
            <div class="playerBtn">
              <button id="play" class="play">
                <svg
                  width="17"
                  height="19"
                  viewBox="0 0 17 19"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path d="M0 0L16.1852 9.5L1.88952e-07 19L0 0Z" />
                </svg>
              </button>
              <button id="pause" class="pause" >
                <svg
                  width="17"
                  height="19"
                  viewBox="0 0 17 19"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path d="M0 6.54013e-07H4.75V19H0V6.54013e-07Z" />
                  <path d="M11.4 0H16.15V19H11.4V0Z" />
                </svg>
              </button>

              <button id="shuffle" class="shuffle" >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    fill-rule="evenodd"
                    d="M0 3.5A.5.5 0 0 1 .5 3H1c2.202 0 3.827 1.24 4.874 2.418.49.552.865 1.102 1.126 1.532.26-.43.636-.98 1.126-1.532C9.173 4.24 10.798 3 13 3v1c-1.798 0-3.173 1.01-4.126 2.082A9.6 9.6 0 0 0 7.556 8a9.6 9.6 0 0 0 1.317 1.918C9.828 10.99 11.204 12 13 12v1c-2.202 0-3.827-1.24-4.874-2.418A10.6 10.6 0 0 1 7 9.05c-.26.43-.636.98-1.126 1.532C4.827 11.76 3.202 13 1 13H.5a.5.5 0 0 1 0-1H1c1.798 0 3.173-1.01 4.126-2.082A9.6 9.6 0 0 0 6.444 8a9.6 9.6 0 0 0-1.317-1.918C4.172 5.01 2.796 4 1 4H.5a.5.5 0 0 1-.5-.5"
                  />
                  <path
                    d="M13 5.466V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192"
                  />
                  <path
                    d="M13 14.534v-3.932a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="addSongDiv">
          <label for="songName">Enter Song Name:</label>
          <input type="text" name="songName" id="songName" />
          <label for="songURL">Enter Song URL:</label>
          <input type="url" name="songURL" id="songURL" />
          <button id="addSongBtn">Add Song</button>
        </div>
      </div>
      <div class="playlist">
        <h2 class="playlist-title" id="playlist">Playlist</h2>

        <ul id="playlistSongs"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
